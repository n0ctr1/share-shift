[package]
name = "share-check"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Recomputes the headline NEAR Intents market share inside an OutLayer TEE"

[[bin]]
name = "share-check"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasi-http-client = "0.2"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
