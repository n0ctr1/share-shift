<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share Shift: NEAR Intents against its rivals</title>
<style>
:root {
  color-scheme: light;
  --page: #f7f5f0; --surface: #fffefb; --rule: #dcd8ce; --grid: #ebe7dd;
  --ink: #15140f; --ink-2: #4b4840; --ink-3: #7d796d;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --good: #0a8a0a; --bad: #c8342f; --good-ink: #0b6410; --bad-ink: #a32621;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gutter: clamp(16px, 4vw, 40px);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #11110f; --surface: #191917; --rule: #33322d; --grid: #262521;
    --ink: #f1efe8; --ink-2: #c4c1b5; --ink-3: #8f8c80;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --good: #35b535; --bad: #e66767; --good-ink: #7ddc7d; --bad-ink: #f5a09c;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.6 var(--sans); }
@media (min-width: 1080px) { body { font-size: 17px; } }
a { color: inherit; text-underline-offset: 3px; }
code { font: 0.86em var(--mono); overflow-wrap: anywhere; }

/* ---- frame ---- */
.frame { max-width: 1100px; margin: 0 auto; padding: 0 var(--gutter); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 48px; }
nav.toc { display: none; }
@media (min-width: 1080px) {
  .layout { grid-template-columns: 180px minmax(0, 1fr); }
  nav.toc { display: block; position: sticky; top: 32px; align-self: start; padding-top: 6px; }
}
nav.toc p { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
nav.toc a { display: block; padding: 5px 0 5px 12px; border-left: 2px solid var(--rule); color: var(--ink-2);
  text-decoration: none; font-size: 14px; line-height: 1.35; }
nav.toc a:hover, nav.toc a.on { color: var(--ink); border-left-color: var(--ink); }

/* ---- masthead ---- */
header.mast { padding: clamp(28px, 6vw, 72px) 0 clamp(24px, 4vw, 44px); border-bottom: 1px solid var(--rule); }
@media (min-width: 900px) {
  header.mast { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0 56px; align-items: end; }
  header.mast .kicker { grid-column: 1 / -1; }
  header.mast .side .lede { margin-top: 0; }
}
.kicker { margin: 0 0 14px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
h1 { margin: 0; font: 600 clamp(30px, 4.6vw, 54px)/1.08 var(--serif); letter-spacing: -.015em; text-wrap: balance; }
.sub { margin: 18px 0 0; font: 400 clamp(18px, 2.2vw, 24px)/1.35 var(--serif); color: var(--ink-2); text-wrap: balance; }
.lede { margin: 22px 0 0; color: var(--ink-2); }
.stamp { margin: 18px 0 0; font-size: 13px; color: var(--ink-3); }

/* ---- stats ---- */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0; border-bottom: 1px solid var(--rule); }
.stat { padding: 18px 16px 18px 0; border-top: 1px solid var(--rule); min-width: 0; }
.stats .stat:nth-child(-n+2) { border-top: 0; }
.stat .k { font-size: 13px; color: var(--ink-2); line-height: 1.3; min-height: 2.6em; }
.stat .v { font: 600 clamp(26px, 3.4vw, 38px)/1.1 var(--serif); font-variant-numeric: tabular-nums; margin: 4px 0; }
.stat .n { font-size: 13px; color: var(--ink-3); line-height: 1.35; }
@media (min-width: 700px) {
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stats .stat:nth-child(-n+3) { border-top: 0; }
  .stat { padding-right: 24px; }
}
@media (min-width: 1240px) {
  .stats { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .stats .stat { border-top: 0; }
}

/* ---- sections ---- */
section { padding: clamp(36px, 6vw, 64px) 0; border-bottom: 1px solid var(--rule); scroll-margin-top: 16px; }
section:last-of-type { border-bottom: 0; }
.eyebrow { margin: 0 0 8px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
h2 { margin: 0 0 18px; font: 600 clamp(24px, 3vw, 32px)/1.15 var(--serif); letter-spacing: -.01em; text-wrap: balance; }
h3 { margin: 0 0 8px; font: 600 18px/1.3 var(--sans); }
.prose { max-width: none; }
.prose p { margin: 0 0 14px; color: var(--ink-2); }
.prose p.lead { color: var(--ink); font-size: 1.06em; }
.figure { margin: clamp(28px, 4vw, 44px) 0 0; }
.figure:first-of-type { margin-top: 24px; }
.src { margin: 12px 0 0; font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
details { margin-top: 10px; font-size: 13px; }
summary { cursor: pointer; color: var(--ink-2); width: fit-content; padding: 4px 0; }
summary:hover { color: var(--ink); }

/* ---- charts ---- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 14px 0 6px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.legend i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.legend i.ln { height: 3px; border-radius: 2px; }
.chart { position: relative; margin-top: 4px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--ink-3); font: 12px var(--sans); }
.chart text.lab { fill: var(--ink-2); }
.chart rect.hit { outline: none; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--rule);
  border-radius: 6px; padding: 8px 10px; font-size: 13px; line-height: 1.45; box-shadow: 0 6px 20px rgba(0,0,0,.14);
  min-width: 168px; display: none; z-index: 2; }
.tip .t { color: var(--ink-3); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; }
.tip .r i { width: 12px; height: 3px; border-radius: 2px; flex: none; }
.tip .r b { font-variant-numeric: tabular-nums; }
.tip .r span { color: var(--ink-2); margin-left: auto; padding-left: 14px; white-space: nowrap; }
.split { display: flex; height: 28px; gap: 2px; margin: 18px 0 8px; }
.split div { border-radius: 3px; min-width: 2px; }
.splitlab { display: flex; justify-content: space-between; gap: 6px 24px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }

/* ---- tables ---- */
.scroll { overflow-x: auto; margin: 18px 0 0; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 16px 9px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th:last-child, td:last-child { padding-right: 0; }
thead th { color: var(--ink-3); font-weight: 500; font-size: 12.5px; white-space: nowrap; border-bottom-color: var(--ink-3); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.first { white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }

/* claims and predictions: a table on wide screens, stacked rows on phones */
.rows { margin: 4px 0 0; border-top: 1px solid var(--ink-3); }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 92px 92px 132px; gap: 0 16px; padding: 12px 0;
  border-bottom: 1px solid var(--rule); align-items: baseline; }
.row.head { color: var(--ink-3); font-size: 12.5px; padding: 8px 0 8px 12px; }
.row .id { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.row .txt { color: var(--ink); }
.row .v { text-align: right; }
.row .m, .row .th { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .th { color: var(--ink-3); }
.row .m small, .row .th small { display: none; }
.verdict { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px 4px 9px; border-radius: 999px;
  font-weight: 650; font-size: 13px; line-height: 1.2; white-space: nowrap; border: 1px solid transparent; }
.verdict::before { font-size: 14px; font-weight: 700; line-height: 1; }
.verdict.SUPPORTED, .verdict.MET { color: var(--good-ink); background: color-mix(in srgb, var(--good) 15%, transparent);
  border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.verdict.REFUTED, .verdict.MISSED { color: var(--bad-ink); background: color-mix(in srgb, var(--bad) 14%, transparent);
  border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.verdict.PENDING { color: var(--ink-2); border-color: var(--rule); }
.verdict.SUPPORTED::before, .verdict.MET::before { content: "\2713"; }
.verdict.REFUTED::before, .verdict.MISSED::before { content: "\2717"; }
.verdict.PENDING::before { content: "\25CB"; }
.row { border-left: 3px solid transparent; padding-left: 12px; }
.row.SUPPORTED, .row.MET { border-left-color: var(--good); }
.row.REFUTED, .row.MISSED { border-left-color: var(--bad); }
.row.head { border-left-color: transparent; }
.tally span { display: inline-flex; align-items: center; gap: 8px; }
.tally i { width: 10px; height: 10px; border-radius: 50%; }
.tally { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0 0 18px; font-size: 15px; color: var(--ink-2); }
.tally b { color: var(--ink); font-variant-numeric: tabular-nums; }
@media (max-width: 719px) {
  .row { grid-template-columns: 36px minmax(0, 1fr) auto; grid-template-areas: "id txt txt" ". m v" ". th v"; gap: 2px 12px; padding: 14px 0 14px 12px; }
  .row.head { display: none; }
  .row .id { grid-area: id; } .row .txt { grid-area: txt; margin-bottom: 6px; }
  .row .m { grid-area: m; text-align: left; } .row .th { grid-area: th; text-align: left; }
  .row .v { grid-area: v; align-self: center; }
  .row .m small, .row .th small { display: inline; color: var(--ink-3); margin-right: 6px; font-size: 12.5px; }
}
ul.limits { margin: 0; padding: 0; list-style: none; }
ul.limits li { padding: 12px 0; border-bottom: 1px solid var(--rule); color: var(--ink-2); }
ul.limits li:last-child { border-bottom: 0; }
footer { padding: 28px 0 56px; font-size: 13px; color: var(--ink-3); border-top: 1px solid var(--rule); }
footer p { margin: 0 0 6px; }
</style>
</head>
<body>
<div class="frame">
  <header class="mast">
    <p class="kicker" id="kicker"></p>
    <div class="headline">
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="side">
      <p class="lede" id="lede"></p>
      <p class="stamp" id="stamp"></p>
    </div>
  </header>
  <div class="stats" id="stats"></div>

  <div class="layout">
    <nav class="toc" id="toc" aria-label="Sections"><p>On this page</p></nav>
    <main id="main"></main>
  </div>

  <footer>
    <p>Full argument in <code>THESIS.md</code>. Every figure on this page is rebuilt from raw data by <code>python3 build.py</code>.</p>
    <p>Data: DefiLlama (volume, fees, revenue), THORChain Midgard (cross-check), NEAR Intents Explorer (channels), CoinGecko (market caps).</p>
  </footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var M = D.metrics, T = D.text;
  var peers = M.meta.peers, subject = M.meta.subject;
  var COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];
  var NS = 'http://www.w3.org/2000/svg';
  var main = document.getElementById('main'), toc = document.getElementById('toc');

  // ---------- helpers ----------
  function el(tag, attrs, text) {
    var svg = /^(svg|g|path|line|rect|text|circle)$/.test(tag);
    var n = svg ? document.createElementNS(NS, tag) : document.createElement(tag);
    for (var k in attrs || {}) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  function usd(x) {
    if (x == null) return 'n/a';
    var a = Math.abs(x);
    if (a >= 1e9) return '$' + (x / 1e9).toFixed(2) + 'B';
    if (a >= 1e6) return '$' + (x / 1e6).toFixed(1) + 'M';
    if (a >= 1e3) return '$' + (x / 1e3).toFixed(0) + 'K';
    return '$' + x.toFixed(0);
  }
  function pct(x, d) { return x == null ? 'n/a' : (100 * x).toFixed(d == null ? 0 : d) + '%'; }
  function bps(x) { return x == null ? 'n/a' : x.toFixed(1) + ' bps'; }
  function fmtBy(unit) { return unit === 'usd' ? usd : unit === 'bps' ? bps : function (x) { return pct(x, 1); }; }
  function unitFmt(v, unit) {
    if (v == null) return 'n/a';
    if (unit === 'growth') return (v >= 0 ? '+' : '') + pct(v);
    if (unit === 'bps') return bps(v);
    if (unit === 'ratio') return v.toFixed(2);
    if (unit === 'count') return String(v);
    if (unit === 'rank') return 'rank ' + v;
    return pct(v, 1);
  }
  function table(head, rows, numCols) {
    var wrap = el('div', {class: 'scroll'}), tb = el('table'), tr = el('tr');
    head.forEach(function (h, i) { tr.appendChild(el('th', numCols[i] ? {class: 'num'} : {}, h)); });
    var thead = el('thead'); thead.appendChild(tr); tb.appendChild(thead);
    var body = el('tbody');
    rows.forEach(function (r) {
      var row = el('tr');
      r.forEach(function (c, i) { row.appendChild(el('td', {class: numCols[i] ? 'num' : (i === 0 ? 'first' : '')}, c)); });
      body.appendChild(row);
    });
    tb.appendChild(body); wrap.appendChild(tb);
    return wrap;
  }
  function prose(paragraphs) {
    var d = el('div', {class: 'prose'});
    paragraphs.filter(Boolean).forEach(function (p, i) { d.appendChild(el('p', i === 0 ? {class: 'lead'} : {}, p)); });
    return d;
  }
  function section(id, navLabel, eyebrow, title) {
    var s = el('section', {id: id});
    if (eyebrow) s.appendChild(el('p', {class: 'eyebrow'}, eyebrow));
    s.appendChild(el('h2', {}, title));
    main.appendChild(s);
    toc.appendChild(el('a', {href: '#' + id}, navLabel));
    return s;
  }
  function source(node, query, fn) {
    var p = el('p', {class: 'src'});
    p.appendChild(document.createTextNode('Query: ')); p.appendChild(el('code', {}, query));
    p.appendChild(document.createTextNode(' · computed in ')); p.appendChild(el('code', {}, fn));
    node.appendChild(p);
  }

  // ---------- chart engine: redraws at the real width, so text never shrinks ----------
  function chart(host, cfg) {
    if (cfg.series.length > 1) {
      var lg = el('div', {class: 'legend'});
      cfg.series.forEach(function (s) {
        var item = el('span'), sw = el('i', cfg.kind === 'line' ? {class: 'ln'} : {});
        sw.style.background = s.color; item.appendChild(sw); item.appendChild(document.createTextNode(s.name));
        lg.appendChild(item);
      });
      host.appendChild(lg);
    }
    var wrap = el('div', {class: 'chart'}); host.appendChild(wrap);
    var tip = el('div', {class: 'tip'});
    var n = cfg.x.length, f = fmtBy(cfg.unit), current = null;

    function draw() {
      var W = Math.max(280, Math.round(wrap.clientWidth));
      var narrow = W < 620;
      var H = Math.round(Math.max(230, Math.min(380, W * 0.44)));
      var labels = !narrow && cfg.kind !== 'bar' && cfg.series.length > 1;
      var m = {l: cfg.unit === 'usd' ? 58 : 44, r: labels ? 118 : 10, t: cfg.band ? 28 : 10, b: 26};
      var iw = W - m.l - m.r, ih = H - m.t - m.b;
      wrap.textContent = '';
      var svg = el('svg', {width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': cfg.title});
      wrap.appendChild(svg); wrap.appendChild(tip);

      var stacks = cfg.series.map(function () { return []; }), ymax = 0;
      for (var i = 0; i < n; i++) {
        var acc = 0;
        cfg.series.forEach(function (s, k) {
          var v = s.values[i];
          if (cfg.kind === 'area') { stacks[k].push([acc, acc + (v || 0)]); acc += v || 0; }
          else if (v != null) ymax = Math.max(ymax, v);
        });
        if (cfg.kind === 'area') ymax = Math.max(ymax, acc);
      }
      ymax = cfg.ymax || ymax * 1.06;
      var step = cfg.kind === 'bar' ? iw / n : iw / Math.max(1, n - 1);
      function X(i) { return m.l + (cfg.kind === 'bar' ? (i + 0.5) * step : i * step); }
      function Y(v) { return m.t + ih - ih * v / ymax; }

      for (var g = 0; g <= 4; g++) {
        var gv = ymax * g / 4, gy = Math.round(Y(gv)) + 0.5;
        svg.appendChild(el('line', {x1: m.l, x2: m.l + iw, y1: gy, y2: gy, stroke: 'var(--grid)', 'stroke-width': 1}));
        svg.appendChild(el('text', {x: m.l - 8, y: gy + 4, 'text-anchor': 'end'},
          cfg.unit === 'usd' ? usd(gv) : cfg.unit === 'bps' ? gv.toFixed(0) : pct(gv)));
      }
      // month ticks, thinned until they fit
      var every = narrow ? 6 : 3, lastYear = '', lastX = -99;
      cfg.x.forEach(function (d, i) {
        var mon = +d.slice(5, 7), newMonth = i === 0 || d.slice(0, 7) !== cfg.x[i - 1].slice(0, 7);
        if (!newMonth || (mon - 1) % every !== 0) return;
        if (X(i) - lastX < 44) return;
        var label = d.slice(0, 4) !== lastYear ? d.slice(0, 7) : d.slice(5, 7);
        lastYear = d.slice(0, 4); lastX = X(i);
        svg.appendChild(el('text', {x: X(i), y: H - 6, 'text-anchor': i === 0 ? 'start' : 'middle'}, label));
      });

      cfg.series.forEach(function (s, k) {
        var path = '', i;
        if (cfg.kind === 'area') {
          for (i = 0; i < n; i++) path += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(stacks[k][i][1]).toFixed(1);
          for (i = n - 1; i >= 0; i--) path += 'L' + X(i).toFixed(1) + ' ' + Y(stacks[k][i][0]).toFixed(1);
          svg.appendChild(el('path', {d: path + 'Z', fill: s.color, stroke: 'var(--page)', 'stroke-width': 1.5, 'stroke-linejoin': 'round'}));
          var a = stacks[k][n - 1];
          if (labels && (a[1] - a[0]) / ymax > 0.07)
            svg.appendChild(el('text', {x: m.l + iw + 10, y: Y((a[0] + a[1]) / 2) + 4, class: 'lab'}, s.name));
        } else if (cfg.kind === 'line') {
          var pen = false, lastI = -1;
          for (i = 0; i < n; i++) {
            var v = s.values[i];
            if (v == null) { pen = false; continue; }
            path += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true; lastI = i;
          }
          svg.appendChild(el('path', {d: path, fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'}));
          s._end = lastI >= 0 ? [X(lastI), Y(s.values[lastI])] : null;
        } else {
          var bw = Math.max(2, step - 2);
          for (i = 0; i < n; i++) {
            var bv = s.values[i]; if (bv == null) continue;
            var y = Y(bv), h = m.t + ih - y, r = Math.min(4, h, bw / 2), x0 = X(i) - bw / 2;
            svg.appendChild(el('path', {fill: s.color, d: 'M' + x0 + ' ' + (m.t + ih) + 'V' + (y + r) + 'q0 ' + (-r) + ' ' + r + ' ' + (-r) +
              'H' + (x0 + bw - r) + 'q' + r + ' 0 ' + r + ' ' + r + 'V' + (m.t + ih) + 'Z'}));
          }
        }
      });
      if (cfg.kind === 'line') {
        var ends = cfg.series.filter(function (s) { return s._end; }).sort(function (a, b) { return a._end[1] - b._end[1]; });
        var prev = -99;
        ends.forEach(function (s) {
          svg.appendChild(el('circle', {cx: s._end[0], cy: s._end[1], r: 4, fill: s.color, stroke: 'var(--page)', 'stroke-width': 2}));
          if (!labels) return;
          var y = Math.max(s._end[1], prev + 15); prev = y;
          svg.appendChild(el('text', {x: m.l + iw + 10, y: y + 4, class: 'lab'}, s.name));
        });
      }
      if (cfg.band) {
        var b0 = -1, b1 = -1;
        cfg.x.forEach(function (d, i) { if (d >= cfg.band.from && d <= cfg.band.to) { if (b0 < 0) b0 = i; b1 = i; } });
        if (b0 >= 0) {
          var bx = X(b0) - step / 2, bw2 = X(b1) - X(b0) + step;
          svg.appendChild(el('rect', {x: bx, y: m.t, width: bw2, height: ih, fill: 'var(--ink)', 'fill-opacity': 0.13}));
          [bx, bx + bw2].forEach(function (x) {
            svg.appendChild(el('line', {x1: x, x2: x, y1: m.t - 4, y2: m.t + ih, stroke: 'var(--ink-2)', 'stroke-width': 1, 'stroke-dasharray': '3 3'}));
          });
          var lx = Math.min(Math.max(bx + bw2 / 2, m.l + 60), m.l + iw - 60);
          svg.appendChild(el('text', {x: lx, y: m.t - 11, 'text-anchor': 'middle', class: 'lab'}, cfg.band.label));
        }
      }
      svg.appendChild(el('line', {x1: m.l, x2: m.l + iw, y1: m.t + ih + 0.5, y2: m.t + ih + 0.5, stroke: 'var(--rule)', 'stroke-width': 1}));

      var hair = el('line', {y1: m.t, y2: m.t + ih, stroke: 'var(--ink-3)', 'stroke-width': 1, visibility: 'hidden'});
      svg.appendChild(hair);
      var hit = el('rect', {class: 'hit', x: m.l, y: m.t, width: iw, height: ih, fill: 'transparent', tabindex: 0});
      svg.appendChild(hit);
      function show(i) {
        i = Math.max(0, Math.min(n - 1, i)); current = i;
        hair.setAttribute('x1', X(i)); hair.setAttribute('x2', X(i)); hair.setAttribute('visibility', 'visible');
        tip.textContent = '';
        tip.appendChild(el('div', {class: 't'}, (cfg.xLabel || '') + cfg.x[i]));
        cfg.series.slice().reverse().forEach(function (s) {
          var r = el('div', {class: 'r'}), key = el('i'); key.style.background = s.color;
          r.appendChild(key); r.appendChild(el('b', {}, f(s.values[i]))); r.appendChild(el('span', {}, s.name));
          tip.appendChild(r);
        });
        if (cfg.tipTotal) {
          var tot = cfg.series.reduce(function (a, s) { return a + (s.values[i] || 0); }, 0);
          var rr = el('div', {class: 'r'}); rr.appendChild(el('i')); rr.appendChild(el('b', {}, f(tot))); rr.appendChild(el('span', {}, 'Total'));
          tip.appendChild(rr);
        }
        tip.style.display = 'block';
        var tw = tip.offsetWidth, left = X(i) + 12;
        if (left + tw > W) left = X(i) - tw - 12;
        tip.style.left = Math.max(0, Math.min(W - tw, left)) + 'px';
        tip.style.top = (m.t + 4) + 'px';
      }
      function hide() { hair.setAttribute('visibility', 'hidden'); tip.style.display = 'none'; }
      function fromEvent(e) {
        var r = svg.getBoundingClientRect(), px = e.clientX - r.left;
        show(Math.round(cfg.kind === 'bar' ? (px - m.l) / step - 0.5 : (px - m.l) / step));
      }
      hit.addEventListener('pointermove', fromEvent);
      hit.addEventListener('pointerdown', fromEvent);
      hit.addEventListener('pointerleave', hide);
      hit.addEventListener('focus', function () { show(current == null ? n - 1 : current); });
      hit.addEventListener('blur', hide);
      hit.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') show((current == null ? n - 1 : current) - 1);
        if (e.key === 'ArrowRight') show((current == null ? n - 1 : current) + 1);
      });
    }
    draw();
    var lastW = wrap.clientWidth, timer = null;
    if (window.ResizeObserver) new ResizeObserver(function () {
      if (Math.abs(wrap.clientWidth - lastW) < 2) return;
      lastW = wrap.clientWidth; clearTimeout(timer); timer = setTimeout(draw, 60);
    }).observe(wrap);
  }

  function figure(parent, cfg) {
    var fig = el('div', {class: 'figure'});
    fig.appendChild(el('h3', {}, cfg.title));
    if (cfg.text) fig.appendChild(prose(cfg.text));
    if (cfg.custom) cfg.custom(fig); else chart(fig, cfg);
    source(fig, cfg.query, cfg.fn);
    if (cfg.series) {
      var det = el('details'); det.appendChild(el('summary', {}, 'Show the numbers'));
      var f = fmtBy(cfg.unit);
      det.appendChild(table([cfg.xHead].concat(cfg.series.map(function (s) { return s.name; })),
        cfg.x.map(function (d, i) { return [d].concat(cfg.series.map(function (s) { return f(s.values[i]); })); }),
        [0].concat(cfg.series.map(function () { return 1; }))));
      fig.appendChild(det);
    }
    parent.appendChild(fig);
  }
  function rowsBlock(head, rows) {
    var box = el('div', {class: 'rows'}), h = el('div', {class: 'row head'});
    ['id', 'txt', 'm', 'th', 'v'].forEach(function (c, i) { h.appendChild(el('div', {class: c}, head[i])); });
    box.appendChild(h);
    rows.forEach(function (r) {
      var row = el('div', {class: 'row ' + r[4]});
      row.appendChild(el('div', {class: 'id'}, r[0]));
      row.appendChild(el('div', {class: 'txt'}, r[1]));
      var mm = el('div', {class: 'm'}); mm.appendChild(el('small', {}, head[2])); mm.appendChild(document.createTextNode(r[2])); row.appendChild(mm);
      var th = el('div', {class: 'th'}); th.appendChild(el('small', {}, head[3])); th.appendChild(document.createTextNode(r[3])); row.appendChild(th);
      var v = el('div', {class: 'v'}); v.appendChild(el('span', {class: 'verdict ' + r[4]}, r[4].charAt(0) + r[4].slice(1).toLowerCase())); row.appendChild(v);
      box.appendChild(row);
    });
    return box;
  }

  // ---------- masthead ----------
  var parts = T.title.split(': '), head = parts.length > 1 ? parts.slice(1).join(': ') : T.title;
  var sentences = head.split('. ');
  document.getElementById('kicker').textContent = 'Investment thesis · NEAR Intents' + (parts.length > 1 ? ' · ' + parts[0] : '');
  var lead = sentences[0].replace(/\.$/, '') + '.';
  document.getElementById('title').textContent = lead.charAt(0).toUpperCase() + lead.slice(1);
  document.getElementById('sub').textContent = sentences.slice(1).join('. ');
  document.getElementById('lede').textContent = T.summary;
  document.getElementById('stamp').textContent = 'Data ' + M.meta.first_day + ' to ' + M.meta.last_day +
    ' · headline window ' + M.meta.window_days + ' days · fetched ' + M.meta.fetched_at.slice(0, 10);

  var tr = M.trailing, yoy = M.yoy, stats = [];
  stats.push(['Share among native-asset swap venues', pct(tr.share[subject]), yoy ? 'was ' + pct(yoy.share_prior[subject]) + ' a year earlier' : '']);
  if (M.wide) stats.push(['Share with four bridges added', pct(M.wide.subject_share), 'rank ' + M.wide.subject_rank_volume + ' of ' + M.wide.venues.length + ' by volume']);
  if (M.halt) stats.push(['Growth while a rival was halted', (M.halt.subject_growth >= 0 ? '+' : '') + pct(M.halt.subject_growth), M.halt.rival + ', ' + M.halt.days + ' days offline']);
  stats.push(['Take rate', bps(tr.take_bps[subject]), 'rival median ' + bps(tr.rival_take_median_bps)]);
  stats.push(['Gross fees reaching NEAR', pct(tr.capture), usd(tr.revenue[subject]) + ' of ' + usd(tr.fees[subject])]);
  if (M.channels) stats.push(['Largest distribution channel', pct(M.channels.top_channel_share), M.channels.channels[0].channel + ', 1Click swaps']);
  else if (M.implied_value) stats.push(['Market cap backed by Intents revenue', pct(M.implied_value.fraction_of_subject_mcap, 1), 'at the rivals’ median multiple']);
  var statsNode = document.getElementById('stats');
  stats.slice(0, 6).forEach(function (t) {
    var d = el('div', {class: 'stat'});
    d.appendChild(el('div', {class: 'k'}, t[0])); d.appendChild(el('div', {class: 'v'}, t[1])); d.appendChild(el('div', {class: 'n'}, t[2]));
    statsNode.appendChild(d);
  });

  // ---------- shared series ----------
  var weeks = M.weekly, months = M.monthly.filter(function (r) { return r.complete; });
  function perPeer(rows, pick) {
    return peers.map(function (p, k) { return {name: p.name, color: COLORS[k], values: rows.map(function (r) { return pick(r, p.slug); })}; });
  }
  var VOL = 'GET api.llama.fi/summary/dexs/{venue}';
  var FEE = 'GET api.llama.fi/summary/fees/{venue}?dataType=dailyFees';
  var REV = 'GET api.llama.fi/summary/fees/near-intents?dataType=dailyRevenue';
  var band = M.halt ? {from: M.halt.first_day, to: M.halt.last_day, label: M.halt.rival + ' halted'} : null;
  var weekX = weeks.map(function (r) { return r.week; });

  // ---------- 1. verdicts ----------
  var s = section('verdicts', 'Verdicts', 'The test', M.claims.length + ' claims, each checked against one number');
  var counts = {}; M.claims.forEach(function (c) { counts[c.verdict] = (counts[c.verdict] || 0) + 1; });
  var tally = el('div', {class: 'tally'});
  Object.keys(counts).sort().reverse().forEach(function (k) {
    var sp = el('span'), dot = el('i'); dot.style.background = k === 'SUPPORTED' ? 'var(--good)' : k === 'REFUTED' ? 'var(--bad)' : 'var(--ink-3)'; sp.appendChild(dot); sp.appendChild(el('b', {}, String(counts[k]))); sp.appendChild(document.createTextNode(' ' + k.toLowerCase())); tally.appendChild(sp);
  });
  s.appendChild(tally);
  s.appendChild(rowsBlock(['#', 'Claim', 'Measured', 'Threshold', 'Verdict'], M.claims.map(function (c) {
    var shown = c.display || {};
    return [c.id, c.claim, shown.value || unitFmt(c.value, c.unit), shown.threshold || unitFmt(c.threshold, c.unit), c.verdict];
  })));
  var note = el('p', {class: 'src'}); note.appendChild(document.createTextNode('Thresholds live in '));
  note.appendChild(el('code', {}, 'pipeline/config.py')); note.appendChild(document.createTextNode('. A verdict is one computed number compared with one threshold.'));
  s.appendChild(note);

  // ---------- 2. stress test ----------
  if (M.halt) {
    var h = M.halt;
    s = section('stress-test', 'The stress test', 'Evidence', 'A rival stopped for ' + M.halt.days + ' days. The result is suggestive, not proof');
    s.appendChild(prose([T.halt_short, T.halt, T.after_halt]));
    var lab = {before: 'Before', during: 'Halt', after_1: 'After, first period', after_2: 'After, second period'};
    var keys = ['before', 'during', 'after_1', 'after_2'].filter(function (k) { return h.periods[k]; });
    var fig = el('div', {class: 'figure'});
    fig.appendChild(el('h3', {}, 'Average daily volume, ' + h.days + '-day periods'));
    fig.appendChild(table(['Period', 'Dates'].concat(peers.map(function (p) { return p.name; })).concat(['Intents share']),
      keys.map(function (k) {
        var row = h.daily_volume[k], tot = peers.reduce(function (a, p) { return a + row[p.slug]; }, 0);
        return [lab[k], h.periods[k][0] + ' to ' + h.periods[k][1]].concat(peers.map(function (p) { return usd(row[p.slug]); })).concat([pct(row[subject] / tot)]);
      }), [0, 0].concat(peers.map(function () { return 1; })).concat([1])));
    source(fig, VOL, 'metrics.halt_experiment()');
    if (h.source) { var sp = el('p', {class: 'src'}); sp.appendChild(document.createTextNode('The halt itself is reported by '));
      sp.appendChild(el('a', {href: h.source, rel: 'noopener'}, 'The Block')); sp.appendChild(document.createTextNode('. Its dates and every volume come from the data.')); fig.appendChild(sp); }
    s.appendChild(fig);
    var fig2 = el('div', {class: 'figure'});
    fig2.appendChild(el('h3', {}, 'How sure is this?'));
    fig2.appendChild(prose([T.halt_check, T.suspensions, T.crosscheck]));
    s.appendChild(fig2);
  }

  // ---------- 3. market position ----------
  s = section('position', 'Market position', 'Evidence', 'First among swap venues, third once bridges are counted');
  if (M.basis) {
    var fb = el('div', {class: 'figure'});
    fb.appendChild(el('h3', {}, 'How volume is counted changes the share, not the leader'));
    fb.appendChild(prose([T.basis, T.events, T.events_others, T.events_limit]));
    fb.appendChild(table(['Counting basis', 'Intents share, four venues', 'Largest', 'Intents share, all eight'],
      M.basis.scenarios.map(function (x) { return [x.label, pct(x.share, 1), x.leader, pct(x.wide_share, 1)]; }), [0, 1, 0, 1]));
    var bs = el('p', {class: 'src'}); bs.appendChild(document.createTextNode('Leg data: '));
    Object.keys(M.basis.venues).forEach(function (k, i) { var v = M.basis.venues[k]; if (i) bs.appendChild(document.createTextNode(', '));
      bs.appendChild(el('a', {href: v.source, rel: 'noopener'}, v.name + ' indexer')); });
    bs.appendChild(document.createTextNode('. Re-computations of Intents volume: '));
    M.basis.subject_notes.forEach(function (n, i) { if (i) bs.appendChild(document.createTextNode(', '));
      bs.appendChild(el('a', {href: n.source, rel: 'noopener'}, n.source.replace('https://github.com/', ''))); });
    bs.appendChild(document.createTextNode('. Computed in '));
    bs.appendChild(el('code', {}, 'metrics.counting_basis()')); bs.appendChild(document.createTextNode('.'));
    fb.appendChild(bs);
    s.appendChild(fb);
  }
  figure(s, {title: 'Share of native cross-chain swap volume, by week', text: [T.share, T.stability], band: band,
    kind: 'area', unit: 'pct', ymax: 1, x: weekX, xLabel: 'Week of ', xHead: 'Week of',
    series: perPeer(weeks, function (r, k) { return r.share[k]; }), query: VOL, fn: 'metrics.weekly()'});
  if (M.wide) {
    var wk = Object.keys(M.wide.weekly_share).sort(), narrowShare = {};
    weeks.forEach(function (r) { narrowShare[r.week] = r.share[subject]; });
    figure(s, {title: 'Intents share by week: four swap venues, and all eight venues', text: [T.wide], band: band,
      kind: 'line', unit: 'pct', ymax: 1, x: wk, xLabel: 'Week of ', xHead: 'Week of',
      series: [{name: 'Four swap venues', color: COLORS[0], values: wk.map(function (k) { return narrowShare[k] == null ? null : narrowShare[k]; })},
               {name: 'All eight venues', color: COLORS[1], values: wk.map(function (k) { return M.wide.weekly_share[k]; })}],
      query: VOL + ' and GET api.llama.fi/summary/bridges/{venue}', fn: 'metrics.wide_report()'});
    var f3 = el('div', {class: 'figure'});
    f3.appendChild(el('h3', {}, 'All eight venues over the ' + M.meta.window_days + '-day window'));
    f3.appendChild(table(['Venue', 'Kind', 'Volume', 'Share', 'Gross fees', 'Take rate'],
      M.wide.venues.map(function (v) { return [v.name, v.kind, usd(v.volume), pct(v.share, 1), usd(v.fees), bps(v.take_bps)]; }), [0, 0, 1, 1, 1, 1]));
    source(f3, VOL + ', /summary/bridges/{venue}, ' + FEE, 'metrics.wide_report()');
    s.appendChild(f3);
  }
  figure(s, {title: 'Weekly volume of the four swap venues', text: [T.volume, T.burst, T.recent], band: band,
    kind: 'area', unit: 'usd', tipTotal: true, x: weekX, xLabel: 'Week of ', xHead: 'Week of',
    series: perPeer(weeks, function (r, k) { return r[k].volume; }), query: VOL, fn: 'metrics.weekly()'});
  if (yoy) figure(s, {title: 'Where the year-on-year volume gain came from', text: [T.decomposition], query: VOL, fn: 'metrics.shift_share()',
    custom: function (c) {
      var ss = yoy.shift_share, bar = el('div', {class: 'split'}), a = el('div'), b = el('div');
      a.style.cssText = 'background:var(--ink-3);flex:' + Math.max(0, ss.market_effect);
      b.style.cssText = 'background:var(--s1);flex:' + Math.max(0, ss.share_effect);
      bar.appendChild(a); bar.appendChild(b); c.appendChild(bar);
      var l = el('div', {class: 'splitlab'});
      l.appendChild(el('span', {}, 'Bigger market, old share: ' + usd(ss.market_effect) + ' (' + pct(1 - yoy.share_effect_fraction) + ')'));
      l.appendChild(el('span', {}, 'Share gained: ' + usd(ss.share_effect) + ' (' + pct(yoy.share_effect_fraction) + ')'));
      c.appendChild(l);
    }});

  // ---------- 4. price and value ----------
  s = section('value', 'Price and value', 'Evidence', 'A normal price, and a small but rising cut for the token');
  figure(s, {title: 'Take rate: gross fees per dollar of volume, by month (bps)',
    text: [T.take_rate, 'Months in which a venue moved under ' + usd(M.meta.min_month_volume) + ' are not drawn.'],
    kind: 'line', unit: 'bps', x: months.map(function (r) { return r.month; }), xHead: 'Month',
    series: perPeer(months, function (r, k) { return r[k].volume >= M.meta.min_month_volume && r[k].fees ? 1e4 * r[k].fees / r[k].volume : null; }),
    query: FEE + ' ÷ ' + VOL, fn: 'metrics.monthly()'});
  var capMonths = months.filter(function (r) { return r.capture != null; });
  figure(s, {title: 'Share of gross Intents fees that reaches NEAR, by month', text: [T.capture, T.capture_trend, T.onchain, T.valuation],
    kind: 'bar', unit: 'pct', x: capMonths.map(function (r) { return r.month; }), xHead: 'Month',
    series: [{name: 'Reaching NEAR', color: COLORS[0], values: capMonths.map(function (r) { return r.capture; })}],
    query: REV + ' ÷ ' + FEE, fn: 'metrics.monthly()'});

  // ---------- 4b. the token ----------
  if (M.token) {
    s = section('token', 'The NEAR token', 'Evidence', 'For the token, buybacks cover a fraction of issuance');
    s.appendChild(prose([T.token, T.token_l1]));
    var tk = M.token, ft = el('div', {class: 'figure'});
    ft.appendChild(el('h3', {}, 'NEAR issued against NEAR bought back, ' + tk.window_days + ' days'));
    var tot = tk.net_issued_near, bar = el('div', {class: 'split'}), a1 = el('div'), a2 = el('div'), a3 = el('div');
    a1.style.cssText = 'background:var(--s1);flex:' + tk.bought_back_near;
    a2.style.cssText = 'background:var(--s3);flex:' + Math.max(0, tk.captured_near - tk.bought_back_near);
    a3.style.cssText = 'background:var(--ink-3);opacity:.45;flex:' + Math.max(0, tot - tk.captured_near);
    bar.appendChild(a1); bar.appendChild(a2); bar.appendChild(a3); ft.appendChild(bar);
    var lb = el('div', {class: 'splitlab'});
    lb.appendChild(el('span', {}, 'Bought back: ' + (tk.bought_back_near / 1e6).toFixed(2) + 'M NEAR (' + pct(tk.offset_buyback) + ')'));
    lb.appendChild(el('span', {}, 'Other captured revenue: ' + ((tk.captured_near - tk.bought_back_near) / 1e6).toFixed(2) + 'M'));
    lb.appendChild(el('span', {}, 'Net new supply: ' + (tot / 1e6).toFixed(2) + 'M NEAR'));
    ft.appendChild(lb);
    source(ft, 'NEAR archival RPC block headers (total_supply); NearBlocks transfers into the revenue wallets', 'metrics.token_check()');
    s.appendChild(ft);
  }

  // ---------- 5. distribution ----------
  if (M.channels) {
    var c = M.channels;
    s = section('channels', 'Who keeps the fees', 'Evidence', 'Who brings the swaps, and who keeps the fees');
    s.appendChild(prose([T.channels, T.routers]));
    var EXQ = 'GET explorer.near-intents.org/api/v0/transactions?statuses=SUCCESS&minUsdPrice=' + c.min_usd;
    var f4 = el('div', {class: 'figure'});
    f4.appendChild(el('h3', {}, 'Distribution channels, 1Click swaps'));
    var LABEL = {yes: 'Yes', no: 'No', other: 'Other bridges only', unlabelled: 'Unlabelled', unknown: 'Operator not identified'};
    f4.appendChild(table(['Channel', 'Volume', 'Share', 'Swaps', 'App fee', 'Routes to rivals', 'Basis'],
      c.channels.map(function (r) { return [r.channel, usd(r.usd), pct(r.share, 1), r.swaps.toLocaleString('en-US'), bps(r.fee_bps), LABEL[r.routes_to_rivals] || r.routes_to_rivals, r.note]; }),
      [0, 1, 1, 1, 1, 0, 0]));
    var srcs = c.channels.filter(function (r) { return r.source; });
    if (srcs.length) {
      var sp2 = el('p', {class: 'src'}); sp2.appendChild(document.createTextNode('Routing sources: '));
      srcs.forEach(function (r, i) { if (i) sp2.appendChild(document.createTextNode(', ')); sp2.appendChild(el('a', {href: r.source, rel: 'noopener'}, r.channel)); });
      sp2.appendChild(document.createTextNode('. Rivals are the other seven venues in this analysis.'));
      f4.appendChild(sp2);
    }
    source(f4, EXQ, 'metrics.channel_report()');
    s.appendChild(f4);
    var f5 = el('div', {class: 'figure'});
    f5.appendChild(el('h3', {}, 'Accounts that receive the app fees'));
    f5.appendChild(prose([T.fee_recipients]));
    f5.appendChild(table(['Recipient', 'Fees', 'Share of app fees'],
      c.recipients.map(function (r) { var nm = r.recipient; return [nm.length > 34 ? nm.slice(0, 10) + '…' + nm.slice(-6) : nm, usd(r.fee_usd), pct(r.share, 1)]; }),
      [0, 1, 1]));
    source(f5, EXQ, 'metrics.channel_report()');
    s.appendChild(f5);
    if (T.halt_channels) {
      var f6 = el('div', {class: 'figure'});
      f6.appendChild(el('h3', {}, 'Which channels grew during the halt'));
      f6.appendChild(prose([T.halt_channels, T.channel_reading]));
      s.appendChild(f6);
    }
  }

  // ---------- 6. robustness ----------
  s = section('window', 'Window sensitivity', 'Robustness', 'How much the choice of window matters');
  s.appendChild(prose(['The headline uses ' + M.meta.window_days + ' days. The same figures over other windows, all ending ' + M.meta.last_day + ':']));
  s.appendChild(table(['Window', 'Intents share', 'Largest venue', 'Take rate', 'Fees reaching NEAR'],
    M.sensitivity.map(function (r) { return [r.days + ' days', pct(r.share, 1), r.leader, bps(r.take_bps), pct(r.capture, 1)]; }), [0, 1, 0, 1, 1]));

  // ---------- 7. predictions ----------
  s = section('predictions', 'Predictions', 'What would change the conclusion', 'Dated predictions, graded by re-running the build');
  s.appendChild(rowsBlock(['#', 'Prediction', 'Now', 'Due', 'Status'], M.predictions.map(function (p) {
    return [p.id, p.text, unitFmt(p.current, /bps$/.test(p.metric) ? 'bps' : 'share'), p.due, p.status];
  })));
  var seal = el('p', {class: 'src'});
  seal.appendChild(document.createTextNode('Sealed: SHA-256 '));
  seal.appendChild(el('code', {}, (M.meta.predictions_sha256 || '').slice(0, 16) + '\u2026'));
  seal.appendChild(document.createTextNode(', OpenTimestamps proof and git tag predictions-v1'));
  if (M.meta.near_anchor) {
    seal.appendChild(document.createTextNode(', and written on NEAR mainnet by '));
    seal.appendChild(el('a', {href: M.meta.near_anchor.explorer, rel: 'noopener'}, 'this transaction'));
    seal.appendChild(document.createTextNode(' (' + M.meta.near_anchor.key + ' on ' + M.meta.near_anchor.contract + ')'));
  }
  seal.appendChild(document.createTextNode('. The build stops if the predictions change.'));
  s.appendChild(seal);

  // ---------- 8. limits ----------
  s = section('limits', 'Limits', 'Caveats', 'What this analysis cannot say');
  var ul = el('ul', {class: 'limits'});
  T.limits.forEach(function (t) { ul.appendChild(el('li', {}, t)); });
  s.appendChild(ul);
  var det = el('details'); det.appendChild(el('summary', {}, 'Weeks in which a venue fell far below its own recent volume'));
  det.appendChild(table(['Venue', 'Week of', 'Volume', 'Prior 8-week median', 'Cause'],
    M.quality_flags.map(function (r) { return [r.peer, r.week, usd(r.volume), usd(r.median_prior_8w), r.cause ? 'The halt' : 'Not found']; }), [0, 0, 1, 1, 0]));
  s.appendChild(det);

  // ---------- nav highlight ----------
  if (window.IntersectionObserver) {
    var links = {};
    Array.prototype.forEach.call(toc.querySelectorAll('a'), function (a) { links[a.getAttribute('href').slice(1)] = a; });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        Object.keys(links).forEach(function (k) { links[k].classList.toggle('on', k === e.target.id); });
      });
    }, {rootMargin: '-20% 0px -70% 0px'});
    Array.prototype.forEach.call(main.querySelectorAll('section'), function (sec) { io.observe(sec); });
  }
})();
</script>
